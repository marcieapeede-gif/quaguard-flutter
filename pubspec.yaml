name: aquaguard
description: "Smart Fish Farming System - Real-time monitoring and management for aquaculture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0

  # Firebase
  firebase_core: ^2.24.0
  firebase_database: ^10.2.0
  firebase_auth: ^4.15.0
  firebase_storage: ^11.5.0

  # UI & Charts
  fl_chart: ^0.63.0
  intl: ^0.19.0

  # Networking
  http: ^1.1.0
  dio: ^5.3.0

  # Local Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.3

  # Utilities
  uuid: ^4.0.0
  get: ^4.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/

  # Fonts
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
